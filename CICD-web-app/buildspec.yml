version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
  build:
    commands:
      - echo Preparing build artifacts...
  post_build:
    commands:
      - echo Build completed successfully on $(date)
artifacts:
  files:
    - CICD-Web-App/index.html
    - CICD-Web-App/appspec.yml
    - CICD-Web-App/scripts/***
  name: cicd-web-app-build-artifact